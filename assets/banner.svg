<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.15" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#primaryGrad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }
    
    /* Dynamic pulsing & wave animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatBubble1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes floatBubble2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-2deg); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes signalPulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }

    .bg-pulse-1 {
      transform-origin: 200px 100px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .bg-pulse-2 {
      transform-origin: 1000px 250px;
      animation: pulseGlow 9s ease-in-out infinite;
    }
    .floating-card-1 {
      animation: floatBubble1 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatBubble2 7s ease-in-out infinite;
    }
    .animated-wire {
      stroke-dasharray: 12 8;
      animation: flowLine 14s linear infinite;
    }
    .ping-circle {
      animation: signalPulse 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Glowing Background Orbs (Behind everything) -->
  <circle class="bg-pulse-1" cx="220" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.18" />
  <circle class="bg-pulse-2" cx="980" cy="270" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.18" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="880" y1="0" x2="880" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Flow Wave Lines (Dynamic messaging waves in background) -->
  <path class="animated-wire" d="M -50 280 C 250 320, 400 230, 650 270 C 900 310, 1050 210, 1250 240" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.3" />
  <path class="animated-wire" d="M -50 110 C 200 60, 450 160, 750 90 C 950 40, 1100 130, 1250 80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" />

  <!-- Ambient Dynamic Floating Graphic (Left Side: SMS Chat Notification) -->
  <g class="floating-card-1" opacity="0.75">
    <rect x="60" y="55" width="210" height="65" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="90" cy="87" r="16" fill="url(#accentCyan)" />
    <!-- SMS icon -->
    <path d="M 83 83 L 97 83 A 2 2 0 0 1 99 85 L 99 91 A 2 2 0 0 1 97 93 L 88 93 L 84 96 L 84 85 A 2 2 0 0 1 83 83" fill="#ffffff" />
    <rect x="115" y="78" width="80" height="7" rx="3" fill="#94a3b8" />
    <rect x="115" y="91" width="125" height="6" rx="3" fill="#475569" />
    <!-- Pulse signal -->
    <circle cx="250" cy="68" r="4" fill="#10b981" />
    <circle class="ping-circle" cx="250" cy="68" r="4" stroke="#10b981" stroke-width="1.5" fill="none" />
  </g>

  <!-- Ambient Dynamic Floating Graphic (Right Side: Two-Way Omnichannel Bubble) -->
  <g class="floating-card-2" opacity="0.75">
    <rect x="930" y="55" width="210" height="65" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="960" cy="87" r="16" fill="url(#accentPurple)" />
    <!-- Bot/Omnichannel icon -->
    <path d="M 953 84 L 967 84 A 2 2 0 0 1 969 86 L 969 90 A 2 2 0 0 1 967 92 L 962 92 L 958 95 L 958 92 L 953 92 A 2 2 0 0 1 951 90 L 951 86 A 2 2 0 0 1 953 84" fill="#ffffff" />
    <rect x="985" y="78" width="95" height="7" rx="3" fill="#c084fc" />
    <rect x="985" y="91" width="130" height="6" rx="3" fill="#475569" />
  </g>

  <!-- Foreground Content (Guaranteed Crisp & High-Contrast Front Layer) -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- Main Title -->
    <text class="title-text" y="0">Awesome Conversational SMS &amp; Messaging</text>
    
    <!-- Subtitle -->
    <text class="subtitle-text" y="44">Curated Directory of Enterprise SaaS Solutions &amp; Open-Source Telephony Platforms</text>
    <text class="subtitle-text" y="72" font-size="15px" fill="#64748b">Two-Way SMS • Omnichannel Inboxes • RCS &amp; WhatsApp • Conversational AI &amp; SMS Gateways</text>
  </g>

  <!-- Interactive Pill Tags in Foreground Bottom Center -->
  <g transform="translate(600, 290)" text-anchor="middle">
    <!-- Tag 1 -->
    <g transform="translate(-310, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text class="badge-text" y="5">💬 Two-Way SMS</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(-105, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
      <text class="badge-text" y="5">📥 Omnichannel Inbox</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(105, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
      <text class="badge-text" y="5">⚡ Open-Source Gateways</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(310, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
      <text class="badge-text" y="5">🤖 Conversational AI</text>
    </g>
  </g>

</svg>
